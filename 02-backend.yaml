apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: three-tier
data:
  app.py: |
    from flask import Flask, jsonify
    import os
    import time
    import psycopg2

    app = Flask(__name__)

    def db_connection():
        return psycopg2.connect(
            host=os.getenv("DB_HOST", "postgres"),
            dbname=os.getenv("POSTGRES_DB", "pocdb"),
            user=os.getenv("POSTGRES_USER", "pocuser"),
            password=os.getenv("POSTGRES_PASSWORD", "pocpassword"),
            connect_timeout=2
        )

    @app.get("/")
    @app.get("/api")
    def api():
        try:
            with db_connection() as conn:
                with conn.cursor() as cur:
                    cur.execute("SELECT 1")
                    result = cur.fetchone()[0]
            return jsonify(
                service="backend",
                message="Backend reached PostgreSQL successfully",
                database_check=result
            )
        except Exception as exc:
            return jsonify(service="backend", database_error=str(exc)), 503

    @app.get("/error")
    def error():
        return jsonify(error="Simulated backend failure"), 500

    @app.get("/slow")
    def slow():
        time.sleep(10)
        return jsonify(message="Slow backend response")

    @app.get("/health")
    def health():
        return jsonify(status="UP")

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir Flask psycopg2-binary && python /app/app.py
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: DB_HOST
              value: postgres
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: backend-code
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: backend-code
          configMap:
            name: backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: three-tier
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: ClusterIP
